# Serves the static build (docs/adr/0001). Copied into the image by the Dockerfile;
# this replaces the custom nginx configuration that used to live in Coolify.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/geo+json;

    # Every form of a Slug's URL works: /postal-sg, /postal-sg/, /postal-sg/index.html
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    # Vite's hashed files never change.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
